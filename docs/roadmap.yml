    summary_de: Erledigungen, die weder Quest noch Ziel sind, so abgelegt, wie du sie sagst, auf einem eigenen Reiter abgehakt, beim Ort oder NPC gezeigt, um den es geht, und ins NG+ mitgenommen.
    links:
