# The roadmap, as data. docs_hooks/roadmap.py (from engineering-conventions, which has it from passageway) renders it as the timeline on
# the roadmap page.
#
# Open entries (status now, next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its pull
# request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `title_de`, `summary_de`, `when_de` and `details_de` are the German page's (docs/roadmap.de.md); English stands in where one is missing.
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  # ---- done ------------------------------------------------------------------------------------------------------------
  - id: sign-in-example
    status: done
    date: 2026-11-03
    icon: card-text-outline
    title: An example on the sign-in page
    title_de: Ein Beispiel auf der Anmeldeseite
    summary: Before signing in, an example card shows what Gamepanion files for a game.
    summary_de: Vor der Anmeldung zeigt eine Beispielkarte, was Gamepanion zu einem Spiel ablegt.
    links:
      - { label: "#91", url: "https://github.com/gamepanion/gamepanion/pull/91" }
  - id: next-links
    status: done
    date: 2026-11-03
    icon: link-variant
    title: Claude links the right page
    title_de: Claude verlinkt die richtige Seite
    summary: What the tools tell Claude to do next links the page that fits, the session, the Overview, the Settings tab, the key settings or the first steps.
    summary_de: Was die Werkzeuge Claude als Nächstes sagen, verlinkt die passende Seite, die Session, den Überblick, den Einstellungen-Reiter, die Schlüssel-Einstellungen oder die ersten Schritte.
    links:
      - { label: "#90", url: "https://github.com/gamepanion/gamepanion/pull/90" }
  - id: chat-on-a-playthrough
    status: done
    date: 2026-11-03
    icon: chat-processing-outline
    title: The chat knows which game
    title_de: Der Chat weiß, um welches Spiel es geht
    summary: The in-app chat always opens on a playthrough and names it, and the empty chat shows three example prompts.
    summary_de: Der Chat in der App öffnet immer zu einem Durchlauf und nennt ihn, und der leere Chat zeigt drei Beispiele.
    links:
      - { label: "#89", url: "https://github.com/gamepanion/gamepanion/pull/89" }
  - id: first-run
    status: done
    date: 2026-11-03
    icon: flag-checkered
    title: A first-run checklist
    title_de: Eine Checkliste für den Start
    summary: With nothing filed, the home page shows the steps for each way in, the connector and your own key, and notices the first session as soon as it arrives.
    summary_de: Solange nichts abgelegt ist, zeigt die Startseite die Schritte für jeden Weg hinein, den Connector und den eigenen Schlüssel, und bemerkt die erste Session, sobald sie da ist.
    links:
      - { label: "#88", url: "https://github.com/gamepanion/gamepanion/pull/88" }
  - id: own-key
    status: done
    date: 2026-11-03
    icon: key-chain-variant
    title: The chat on your own Anthropic key
    title_de: Der Chat mit deinem eigenen Anthropic-Schlüssel
    summary: Paste your Anthropic API key on the account page; it is stored encrypted, never shown again, and the in-app chat runs on it.
    summary_de: Trag deinen Anthropic-API-Schlüssel auf der Kontoseite ein; er wird verschlüsselt gespeichert, nie wieder angezeigt, und der Chat in der App läuft damit.
    links:
      - { label: "ADR 0021", url: "https://docs.gamepanion.app/adr/0021-players-own-keys/" }
      - { label: "#87", url: "https://github.com/gamepanion/gamepanion/pull/87" }
  - id: continue
    status: done
    date: 2026-11-03
    icon: play-circle-outline
    title: Continue where you left off
    title_de: Weiterspielen, wo du aufgehört hast
    summary: The home page opens with a Continue card for the game you are playing, and a playthrough's Overview is its briefing, from the same read as Claude's.
    summary_de: Die Startseite beginnt mit einer Weiterspielen-Karte für das Spiel, das du gerade spielst, und der Überblick eines Durchlaufs ist sein Briefing, aus derselben Abfrage wie Claudes.
