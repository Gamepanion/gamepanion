    summary_de: Zwei Einstellungen je Spieldurchgang, auf seiner Seite oder über Claude. Hintergrund ist, wie viel Claude nach jeder Sitzung von sich aus ergänzt, Spoiler, was ohne Nachfrage zu sehen ist; darüber bietet Claude nur an.
