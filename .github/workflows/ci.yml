name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", mkdocs.yml]
  # Every pull request, so the checks main requires always report; one that touches only the docs passes them at once (changes).
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but the docs changed: a pull request touching only docs/** and mkdocs.yml skips the checks below, and a skipped
  # required check counts as passed. A push always runs them (push itself ignores docs-only changes).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|mkdocs\.yml$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The committed openapi.json must match the route table.
  generate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      # --porcelain also catches files the generator added that aren't committed yet.
      - name: Generated files are current
        run: test -z "$(git status --porcelain)" || { git status --short; echo "::error::Generated files are stale. Run npm run generate and commit."; exit 1; }
      - run: npx -y @redocly/cli@2.57.0 lint openapi.json

  # A push to main publishes ghcr.io/gamepanion/gamepanion:main, a version tag vX.Y.Z publishes :X.Y.Z, :X.Y and :latest, each
  # only once check passed in the same run, so an untested image is never published. Only this job may write packages; the
  # rest of the workflow stays read-only.
  image:
    if: github.event_name == 'push'
    needs: [check, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gamepanion/gamepanion
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # products-1, which runs gamepanion.app, is arm64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attached to the image in the registry: what it contains, and how and from which commit it was built.
          sbom: true
          provenance: mode=max
      # The SBOM files of a release (CycloneDX), attached to it by the release job. Written on main too, so a broken step shows before a
      # tag needs it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: SBOM of the npm dependencies
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="0.0.0-main.sha${GITHUB_SHA::7}" ;;
          esac
          echo "SBOM_VERSION=$version" >> "$GITHUB_ENV"
          mkdir sbom
          npm version "$version" --no-git-tag-version --allow-same-version
          # What package-lock.json resolves, without the packages only tests and the build use.
          npm sbom --package-lock-only --omit dev --sbom-format cyclonedx > "sbom/gamepanion-$version-npm.cdx.json"
      # What is in the pushed image (linux/amd64), the distroless base's packages included.
      - name: SBOM of the image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/gamepanion/gamepanion@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom/gamepanion-${{ env.SBOM_VERSION }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # A version tag also makes the GitHub release, its notes the pull requests merged since the previous tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
      # The SBOM files the image job wrote (CycloneDX): the npm dependencies and the image's contents.
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Attach the SBOM files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
