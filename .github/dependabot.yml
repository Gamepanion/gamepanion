# Dependency bumps as pull requests with CI run (convention "Dependabot with auto-merge"): patch and minor bumps merge by themselves once
# check and generate are green (dependabot-automerge.yml), majors wait for review. Security updates (switched on in the repository's
# settings) come at once and skip the cooldown; everything else waits two weeks after a release and comes grouped on Monday mornings.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # @types/node follows the Node major the app runs on (.nvmrc, the Dockerfile), by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # Next.js and its ESLint config move together; so do Better Auth and its plugins (pinned to one version).
      nextjs:
        patterns: [next, eslint-config-next, "@next/*"]
      better-auth:
        patterns: [better-auth, "@better-auth/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # The Node major follows .nvmrc and the Dockerfile together, by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
